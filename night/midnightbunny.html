<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>midnightbunny.exe – Containment Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="/css/midnightbunny-bio.css" />

  <link
    rel="icon"
    type="image/png"
    sizes="512x512"
    href="/images/midnightbunny-avatar.png" />

  <link
    rel="apple-touch-icon"
    href="/images/midnightbunny-avatar.png" />

  <meta
    name="theme-color"
    content="#05030d"
    id="themeColorMeta" />
</head>

<body>

  <div class="overlay overlay-rain" aria-hidden="true"></div>
  <div class="overlay overlay-particles" aria-hidden="true"></div>
  <div class="overlay overlay-vignette" aria-hidden="true"></div>

  <header class="hud-top">

    <div class="hud-brand">

      <div
        class="hud-title glitch"
        id="siteTitle"
        data-text="midnightbunny.exe">

        midnightbunny.exe

      </div>

      <div
        class="hud-sub"
        id="siteSubtitle">

        CONTAINMENT ACTIVE • TOUCH PERMISSIONS REVOKED

      </div>

    </div>

    <nav
      class="hud-nav"
      id="siteNav"
      aria-label="Bio navigation">
    </nav>

    <div
      class="hud-stats"
      id="topStats">
    </div>

  </header>

  <main class="grid">

    <!-- PROFILE -->

    <section class="panel profile">

      <div class="panel-head">
        <span id="profilePanelTitle">USER PROFILE</span>
        <span class="chip" id="profileChip">OBSERVED</span>
      </div>

      <div class="avatar">

        <img
          class="avatar-img"
          id="avatarImg"
          src="/images/midnightbunny-avatar.png"
          alt="midnightbunny.exe avatar"
          onerror="this.style.display='none';this.parentElement.classList.add('avatar-fallback');">

        <div
          class="avatar-silhouette"
          aria-hidden="true">
        </div>

      </div>

      <div
        class="profile-name"
        id="profileName">

        MIDNIGHTBUNNY.EXE

      </div>

      <div
        class="profile-meta"
        id="profileMeta">

        Build:
        <b>containment</b>
        •
        Level:
        <b>21</b>
        •
        Status:
        <b>DO NOT PET</b>

      </div>

      <div
        class="bars"
        id="profileBars">
      </div>

      <div class="divider"></div>

      <div
        class="mini-title"
        id="loadoutTitle">

        LOADOUT

      </div>

      <ul
        class="list"
        id="loadoutList">
      </ul>

    </section>

    <!-- BIO -->

    <section class="panel quest">

      <div class="panel-head">
        <span id="bioPanelTitle">BIO LOG</span>
        <span class="chip pink" id="bioChip">LIVE</span>
      </div>

      <ul
        class="quests"
        id="bioLogList">
      </ul>

      <div class="divider"></div>

      <div
        class="mini-title"
        id="vibesTitle">

        VIBES

      </div>

      <div
        class="chips-row"
        id="vibesList">
      </div>

    </section>

    <!-- STATS -->

    <section class="panel party">

      <div class="panel-head">
        <span id="statsPanelTitle">Stats</span>
        <span class="chip pink" id="statsPanelChip">404</span>
      </div>

      <div id="statsCards"></div>

    </section>

    <!-- STATUS -->

    <section class="panel battle">

      <div class="panel-head">
        <span id="statusPanelTitle">STATUS REPORT</span>
        <span class="chip" id="statusPanelChip">LIVE</span>
      </div>

      <ul
        class="list"
        id="statusReportList">
      </ul>

    </section>

    <!-- TERMINAL -->

    <section class="panel syslog">

      <div class="panel-head">
        <span id="systemLogTitle">SYSTEM LOG</span>
        <span class="chip pink" id="systemLogChip">STREAMING</span>
      </div>

      <div
        class="terminal"
        aria-label="System log terminal"
        id="systemLogLines">
      </div>

    </section>

  </main>
  <div class="sao-toast show" role="status" aria-live="polite">
    <div class="sao-toast-header" id="toastHeader">SYSTEM</div>

    <div class="sao-toast-body">
      <span class="type" id="toastType"></span><span class="caret">▍</span>
    </div>

    <button
      class="sao-toast-close"
      type="button"
      aria-label="Close notification">
      ✕
    </button>

    <div class="sao-toast-progress"></div>
  </div>

<script>

const DATA_URL="/data/midnightbunny.json";

function escapeHtml(str){
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#39;");
}

function setText(id,value){
  const el=document.getElementById(id);
  if(el&&value!==undefined&&value!==null)el.textContent=value;
}

function setHTML(id,value){
  const el=document.getElementById(id);
  if(el&&value!==undefined&&value!==null)el.innerHTML=value;
}

function applyTheme(theme){

if(!theme)return;

const root=document.documentElement;

const map={
bg:"--bg",
bg2:"--bg2",
panel:"--panel",
panel2:"--panel2",
cyan:"--cyan",
cyan2:"--cyan2",
blue:"--blue",
violet:"--violet",
purple:"--purple",
pink:"--pink",
pink2:"--pink2",
line:"--line",
line2:"--line2",
text:"--text",
muted:"--muted",
shadow:"--shadow"
};

Object.entries(map).forEach(([json,css])=>{
if(theme[json])root.style.setProperty(css,theme[json]);
});

if(theme.themeColor){
document.getElementById("themeColorMeta")
.setAttribute("content",theme.themeColor);
}

if(theme.titleGlow)
root.style.setProperty("--title-glow",theme.titleGlow);

if(theme.glitchTop)
root.style.setProperty("--glitch-top",theme.glitchTop);

if(theme.glitchBottom)
root.style.setProperty("--glitch-bottom",theme.glitchBottom);

}

function renderNav(items){

const nav=document.getElementById("siteNav");
nav.innerHTML="";

items.forEach(item=>{

const a=document.createElement("a");

a.href=item.href||"#";

a.className="hud-link"+(item.active?" active":"");

a.textContent=item.label||"LINK";

nav.appendChild(a);

});

}

function renderTopStats(stats){

const wrap=document.getElementById("topStats");

wrap.innerHTML="";

stats.forEach(stat=>{

const div=document.createElement("div");

div.className="stat";

div.innerHTML=`${escapeHtml(stat.label)} <b>${escapeHtml(stat.value)}</b>`;

wrap.appendChild(div);

});

}

function renderBars(bars){

const wrap=document.getElementById("profileBars");

wrap.innerHTML="";

bars.forEach(bar=>{

const outer=document.createElement("div");

outer.className="bar-wrap";

const width=Math.max(0,Math.min(bar.percent||0,100));

outer.innerHTML=`
<div class="bar-label">${escapeHtml(bar.label)}</div>

<div class="bar">
<div class="fill ${bar.fillClass||""}" style="width:${width}%"></div>
</div>

<div class="bar-value">${escapeHtml(bar.value)}</div>
`;

wrap.appendChild(outer);

});

}

function renderSimpleList(id,list){

const ul=document.getElementById(id);

ul.innerHTML="";

list.forEach(item=>{

const li=document.createElement("li");

li.textContent=item;

ul.appendChild(li);

});

}

function renderBioLog(entries){

const list=document.getElementById("bioLogList");

list.innerHTML="";

entries.forEach(entry=>{

const li=document.createElement("li");

if(typeof entry==="string"){

li.innerHTML=`
<span class="q-dot"></span>
${escapeHtml(entry)}
`;

}else{

li.innerHTML=`
<span class="q-dot"></span>
${escapeHtml(entry.text)}

${entry.tag?
`<span class="tag ${entry.tagClass||""}">
${escapeHtml(entry.tag)}
</span>`:""}
`;

}

list.appendChild(li);

});

}

function renderVibes(vibes){

const wrap=document.getElementById("vibesList");

wrap.innerHTML="";

vibes.forEach(vibe=>{

const chip=document.createElement("span");

chip.className="soft-chip";

chip.textContent=vibe;

wrap.appendChild(chip);

});

}

function renderStatsCards(cards){

const wrap=document.getElementById("statsCards");

wrap.innerHTML="";

cards.forEach((card,index)=>{

const div=document.createElement("div");

const width=Math.max(0,Math.min(card.percent||0,100));

div.className="member";

div.innerHTML=`

<div class="pfp ${index>0?"pfp"+(index+1):""}"></div>

<div class="m-info">

<div class="m-name">

${escapeHtml(card.name)}

<span class="lvl">${escapeHtml(card.level)}</span>

</div>

<div class="m-bar">

<div class="m-fill" style="width:${width}%"></div>

</div>

<div class="m-sub">

${escapeHtml(card.subtext)}

</div>

</div>

`;

wrap.appendChild(div);

});

}

function renderSystemLog(lines){

const wrap=document.getElementById("systemLogLines");

wrap.innerHTML="";

lines.forEach(line=>{

if(line.type==="gap"){

const gap=document.createElement("div");

gap.className="term-gap";

wrap.appendChild(gap);

return;

}

const div=document.createElement("div");

div.className="term-line";

div.innerHTML=`

<span class="term-time">${escapeHtml(line.time)}</span>

${line.dimPrefix?
`<span class="term-dim">${escapeHtml(line.dimPrefix)}</span>`:""}

${escapeHtml(line.message)}

${line.status?
`<span class="${line.statusClass}">
${escapeHtml(line.status)}
</span>`:""}

`;

wrap.appendChild(div);

});

}

function typingToast(text){

const out=document.getElementById("toastType");

out.textContent="";

let i=0;

(function type(){

out.textContent=text.slice(0,i++);

if(i<=text.length)setTimeout(type,24);

})();

}

async function loadBio(){

try{

const response=await fetch(DATA_URL,{cache:"no-store"});

const data=await response.json();

applyTheme(data.theme);

document.title=data.head.title;

const title=document.getElementById("siteTitle");

title.textContent=data.header.title;

title.dataset.text=data.header.title;

setText("siteSubtitle",data.header.subtitle);

renderNav(data.header.nav);

renderTopStats(data.header.stats);

setText("profilePanelTitle",data.profile.panelTitle);

setText("profileChip",data.profile.panelChip);

const avatar=document.getElementById("avatarImg");

if(avatar&&data.profile.avatar){

avatar.src=data.profile.avatar.src;

avatar.alt=data.profile.avatar.alt||"avatar";

}

setText("profileName",data.profile.name);

setHTML("profileMeta",data.profile.metaHtml);

renderBars(data.profile.bars);

setText("loadoutTitle",data.profile.loadoutTitle);

renderSimpleList("loadoutList",data.profile.loadout);

setText("bioPanelTitle",data.bio.panelTitle);

setText("bioChip",data.bio.panelChip);

renderBioLog(data.bio.entries);

setText("vibesTitle",data.bio.vibesTitle);

renderVibes(data.bio.vibes);

setText("statsPanelTitle",data.statsPanel.panelTitle);

setText("statsPanelChip",data.statsPanel.panelChip);

renderStatsCards(data.statsPanel.cards);

setText("statusPanelTitle",data.statusReport.panelTitle);

setText("statusPanelChip",data.statusReport.panelChip);

renderSimpleList("statusReportList",data.statusReport.items);

setText("systemLogTitle",data.systemLog.panelTitle);

setText("systemLogChip",data.systemLog.panelChip);

renderSystemLog(data.systemLog.lines);

setText("toastHeader",data.toast.header);

typingToast(data.toast.line);

}catch(e){

console.error(e);

setText("toastType","failed to load midnightbunny.json");

}

}

loadBio();

</script>

</body>
</html>
