<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Midnight Bunny OS</title>

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/windows.css">
<link rel="stylesheet" href="css/effects.css">
<link rel="stylesheet" href="css/animations.css">

</head>

<body>

<!-- ======================================================
Wallpaper
====================================================== -->

<div id="wallpaper"></div>

<div id="noise"></div>

<div id="glow"></div>

<!-- ======================================================
HUD
====================================================== -->

<header id="hud">

    <div class="hud-left">

        <span id="os-name">

            Midnight Bunny OS

        </span>

        <span id="os-version">

            Rev 10

        </span>

    </div>

    <div class="hud-right">

        <span id="desktop-clock">

            --:--

        </span>

    </div>

</header>

<!-- ======================================================
Desktop
====================================================== -->

<main id="desktop">

    <section id="window-layer">

        <!-- Windows generated here -->

    </section>

</main>

<!-- ======================================================
Toast Notifications
====================================================== -->

<div id="toast-layer"></div>

<!-- ======================================================
Context Menu
====================================================== -->

<div id="context-menu"></div>

<!-- ======================================================
Boot Overlay
====================================================== -->

<div id="boot-layer"></div>

<!-- ======================================================
Debug Console
====================================================== -->

<div id="debug-console">

    <div id="debug-header">

        🐇 Bunny Debug Console

        <button id="debug-clear">

            Clear

        </button>

    </div>

    <div id="debug-output"></div>

</div>

<!-- ======================================================
JavaScript
====================================================== -->

<script src="js/app.js"></script>
<script src="js/windows.js"></script>
<script src="js/desktop.js"></script>
<script src="js/terminal.js"></script>

</body>

</html>
