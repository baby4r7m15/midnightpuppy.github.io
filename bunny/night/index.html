<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>midnightbunny.exe</title>
  <link rel="icon" type="image/png" sizes="512x512" href="/bunny/night/images/midnightbunny-avatar.png" />
  <link rel="apple-touch-icon" href="/bunny/night/images/midnightbunny-avatar.png" />
  <meta name="theme-color" content="#070914" id="themeColorMeta" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>

  :root{
    --void:#050308;
    --panel:#0f0818;
    --panel-edge:#3a2160;
    --pink:#ff2fc4;
    --cyan:#2ff2ff;
    --purple:#b04bff;
    --green:#39ff9e;
    --yellow:#ffe66d;
    --text-main:#f5ecff;
    --text-dim:#b6a3dd;

    --f-display:'VT323', monospace;
    --f-mono:'JetBrains Mono', monospace;
    --f-pixel:'Press Start 2P', monospace;

    --scale:1;
    --bg-url:none;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}

  body{
    background:var(--void);
    color:var(--text-main);
    font-family:var(--f-mono);
    overflow:hidden; /* the whole point: nothing here ever scrolls */
    position:fixed;
    inset:0;
  }

  /* ---------- viewport: fixed frame that always fills the screen, no scroll ---------- */
  #viewport{
    position:fixed; inset:0;
    overflow:hidden;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(176,75,255,0.18), transparent 60%),
      radial-gradient(ellipse at 10% 100%, rgba(255,47,196,0.14), transparent 55%),
      var(--void);
  }

  /* ---------- loading ---------- */
  .loading{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:var(--f-display); font-size:1.6rem; color:var(--green);
    letter-spacing:0.05em; z-index:200; background:var(--void);
  }
  .loading::after{content:"_"; animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}

  /* ---------- canvas: one fixed-size "poster" that gets uniformly scaled to fit ----------
     IMPORTANT: #canvas itself carries no filter/backdrop-filter/blend-mode. Those force the
     browser to rasterize the whole subtree (including every card's text) to a bitmap before
     the scale transform is applied, which is what was making the text soft/blurry. All photo
     color-grading and blend effects now live on the isolated .bg-layer behind the cards instead. */
  #canvas{
    position:absolute;
    left:50%; top:50%;
    transform:scale(var(--scale));
    transform-origin:50% 50%;
    overflow:visible; /* cards are allowed to sit right at the edge without being sliced off */
  }

  .bg-layer{
    position:absolute; inset:0; z-index:0;
    border-radius:14px; overflow:hidden; isolation:isolate;
    box-shadow:0 0 0 1px rgba(255,255,255,0.05), 0 40px 120px rgba(0,0,0,0.8);
    background-image:var(--bg-url);
    background-size:cover;
    background-position:center 30%;
    filter:saturate(1.3) contrast(1.08);
  }
  /* legibility wash + duotone chaos over the photo */
  .bg-layer::before{
    content:"";
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background:
      linear-gradient(180deg, rgba(5,3,8,0.55) 0%, rgba(5,3,8,0.25) 30%, rgba(5,3,8,0.35) 70%, rgba(5,3,8,0.75) 100%),
      linear-gradient(100deg, rgba(255,47,196,0.16), rgba(47,242,255,0.1) 50%, rgba(176,75,255,0.16));
  }
  /* scanlines, confined to the photo layer — plain overlay, no blend-mode, so it can't
     force the cards above it into the same raster pass */
  .bg-layer::after{
    content:"";
    position:absolute; inset:0; z-index:3; pointer-events:none;
    background:repeating-linear-gradient(
      to bottom, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 1px,
      transparent 2px, transparent 3px);
  }

  /* occasional glitch-slice pulse — lives inside the isolated .bg-layer only */
  .glitch-pulse{
    position:absolute; inset:0; z-index:2; pointer-events:none;
    background-image:var(--bg-url); background-size:cover; background-position:center 30%;
    mix-blend-mode:screen; opacity:0;
    animation:pulse 7s infinite;
  }
  @keyframes pulse{
    0%,92%,100%{opacity:0; clip-path:inset(0 0 100% 0); transform:translateX(0);}
    93%{opacity:0.35; clip-path:inset(20% 0 55% 0); transform:translateX(-8px);}
    94%{opacity:0.25; clip-path:inset(55% 0 15% 0); transform:translateX(10px);}
    95%{opacity:0;}
  }

  /* ---------- scattered elements ---------- */
  .badge{
    position:absolute; z-index:20;
    font-family:var(--f-pixel); font-size:14px; padding:8px 12px;
    border-radius:999px; border:2px solid currentColor; background:rgba(5,3,8,0.85);
    white-space:nowrap;
    rotate:var(--rot,0deg);
    animation:drop 0.6s ease both, wobble 5s ease-in-out infinite;
  }

  .card{
    position:absolute;
    background:linear-gradient(160deg, rgba(255,255,255,0.05), transparent 45%), rgba(15,8,24,0.93);
    border:2px solid var(--panel-edge);
    border-radius:6px;
    box-shadow:0 14px 34px rgba(0,0,0,0.55);
    rotate:var(--rot,0deg);
    animation:drop 0.6s ease both, wobble 6s ease-in-out infinite;
    overflow-wrap:break-word;
  }
  /* drop-in only touches opacity/translate/scale; wobble only touches rotate —
     independent transform properties so the two animations don't fight over one 'transform' value */
  @keyframes drop{
    from{opacity:0; translate:0 -14px; scale:0.96;}
    to{opacity:1; translate:0 0; scale:1;}
  }
  @keyframes wobble{
    0%,100%{rotate:var(--rot,0deg);}
    50%{rotate:calc(var(--rot,0deg) + 1.1deg);}
  }

  .card[data-accent="neonPink"]{border-color:var(--pink); box-shadow:0 14px 34px rgba(0,0,0,0.55), 0 0 26px rgba(255,47,196,0.35);}
  .card[data-accent="neonCyan"]{border-color:var(--cyan); box-shadow:0 14px 34px rgba(0,0,0,0.55), 0 0 26px rgba(47,242,255,0.35);}
  .card[data-accent="neonPurple"]{border-color:var(--purple); box-shadow:0 14px 34px rgba(0,0,0,0.55), 0 0 26px rgba(176,75,255,0.35);}
  .card[data-accent="neonGreen"]{border-color:var(--green); box-shadow:0 14px 34px rgba(0,0,0,0.55), 0 0 26px rgba(57,255,158,0.35);}
  .card[data-accent="neonYellow"]{border-color:var(--yellow); box-shadow:0 14px 34px rgba(0,0,0,0.55), 0 0 26px rgba(255,230,109,0.35);}

  .badge[data-accent="neonPink"]{color:var(--pink);}
  .badge[data-accent="neonCyan"]{color:var(--cyan);}
  .badge[data-accent="neonPurple"]{color:var(--purple);}
  .badge[data-accent="neonGreen"]{color:var(--green);}
  .badge[data-accent="neonYellow"]{color:var(--yellow);}

  .card__bar{
    display:flex; align-items:center; gap:8px;
    padding:8px 10px;
    background:rgba(0,0,0,0.45);
    border-bottom:1px solid var(--panel-edge);
    font-family:var(--f-pixel); font-size:9px; color:var(--text-dim);
  }
  .dot{width:10px; height:10px; border-radius:50%; display:inline-block;}
  .dot--r{background:#ff5f57;} .dot--y{background:#febc2e;} .dot--g{background:#28c840;}

  .card__body{padding:16px 18px;}

  /* ---------- hero / glitch banner ---------- */
  .card--glitch-banner{background:transparent; border:none; box-shadow:none; backdrop-filter:none; text-align:center; padding:6px 10px;}
  .glitch{
    font-family:var(--f-display);
    font-size:2.7rem;
    letter-spacing:0.02em; margin:0; position:relative; color:var(--text-main);
    text-shadow:0 0 22px rgba(255,47,196,0.55), 0 0 4px #000;
    overflow-wrap:break-word;
  }
  .glitch::before, .glitch::after{
    content:attr(data-text); position:absolute; left:0; top:0; width:100%; overflow:hidden; background:transparent;
  }
  .glitch::before{color:var(--cyan); left:3px; animation:glitch-1 2.6s infinite linear alternate-reverse;}
  .glitch::after{color:var(--pink); left:-3px; animation:glitch-2 1.9s infinite linear alternate-reverse;}
  @keyframes glitch-1{
    0%{clip-path:inset(0 0 85% 0);} 20%{clip-path:inset(10% 0 60% 0);}
    40%{clip-path:inset(40% 0 30% 0);} 60%{clip-path:inset(70% 0 5% 0);}
    80%{clip-path:inset(20% 0 50% 0);} 100%{clip-path:inset(0 0 90% 0);}
  }
  @keyframes glitch-2{
    0%{clip-path:inset(80% 0 0 0);} 25%{clip-path:inset(30% 0 40% 0);}
    50%{clip-path:inset(60% 0 10% 0);} 75%{clip-path:inset(5% 0 70% 0);}
    100%{clip-path:inset(45% 0 25% 0);}
  }
  .hero__sub{
    font-family:var(--f-mono); color:var(--text-main); font-size:0.95rem; font-weight:700;
    margin-top:6px; letter-spacing:0.03em; text-shadow:0 2px 10px rgba(0,0,0,0.9);
  }

  /* ---------- terminal ---------- */
  .term-line{margin:0 0 6px 0; font-size:0.78rem; line-height:1.5;}
  .term-line:last-child{margin-bottom:0;}
  .term-prompt{color:var(--cyan); margin-right:6px; font-weight:700;}

  /* ---------- stat-block ---------- */
  .stat-row{display:flex; gap:8px; font-size:0.76rem; margin-bottom:5px;}
  .stat-row:last-child{margin-bottom:0;}
  .stat-key{color:var(--purple); min-width:60px; font-weight:700;}
  .stat-val{color:var(--text-main);}

  /* ---------- quote ---------- */
  .quote__text{font-family:var(--f-display); font-size:1.4rem; line-height:1.3; margin:0; color:var(--green);}
  .quote__text::before{content:"“";} .quote__text::after{content:"”";}
  .quote__sig{font-size:0.68rem; color:var(--text-dim); margin-top:8px;}

  /* ---------- error window ---------- */
  .error__msg{font-size:0.82rem; margin:0 0 6px 0; font-weight:700;}
  .error__detail{font-size:0.68rem; color:var(--text-dim); margin:0 0 12px 0;}
  .error__buttons{display:flex; gap:8px; flex-wrap:wrap;}
  .error__btn{
    font-family:var(--f-mono); font-size:0.68rem; padding:6px 10px;
    background:rgba(255,255,255,0.08); border:1px solid var(--panel-edge); border-radius:4px;
    color:var(--text-main); cursor:default;
  }

  /* ---------- list ---------- */
  .list{margin:0; padding-left:1.1em; font-size:0.76rem; line-height:1.6;}
  .list li::marker{color:var(--yellow);}

  /* ---------- links / footer ---------- */
  .card--links{background:transparent; border:none; box-shadow:none; backdrop-filter:none;}
  .links__row{display:flex; flex-wrap:wrap; gap:10px; justify-content:center;}
  .links__item{
    font-family:var(--f-pixel); font-size:0.6rem; color:var(--text-main); text-decoration:none;
    padding:9px 13px; border:2px solid var(--panel-edge); border-radius:6px; background:rgba(15,8,24,0.75);
  }
  .links__item:hover{border-color:var(--pink); color:var(--pink);}
  .copyright{text-align:center; font-size:0.62rem; color:var(--text-dim); margin-top:10px;}

  @media (prefers-reduced-motion: reduce){
    .glitch::before,.glitch::after,.glitch-pulse,.loading::after,.card,.badge{animation:none !important;}
  }
</style>
</head>
<body>

  <div id="viewport">
    <div class="loading" id="loading">loading</div>
  </div>

  <script src="/bunny/night/js/script.js"></script>
</body>
</html>
