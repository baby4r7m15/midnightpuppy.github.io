<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Midnight Bunny // profile.exe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>

  /* ---------- tokens (overridden at runtime from midnightbunny.json) ---------- */
  :root{
    --void:#0a0614;
    --panel:#150c26;
    --panel-edge:#2a1a44;
    --pink:#ff3fb4;
    --cyan:#3ff2ff;
    --purple:#a95bff;
    --green:#3dffa0;
    --yellow:#ffe066;
    --text-main:#efe4ff;
    --text-dim:#9a86c2;

    --f-display:'VT323', monospace;
    --f-mono:'JetBrains Mono', monospace;
    --f-pixel:'Press Start 2P', monospace;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    background:
      radial-gradient(ellipse at 50% 0%, rgba(169,91,255,0.16), transparent 60%),
      radial-gradient(ellipse at 15% 85%, rgba(255,63,180,0.12), transparent 55%),
      var(--void);
    color:var(--text-main);
    font-family:var(--f-mono);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  /* ---------- ambience: scanlines + crt flicker ---------- */
  .scanlines{
    position:fixed; inset:0; pointer-events:none; z-index:50;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.035) 0px,
      rgba(255,255,255,0.035) 1px,
      transparent 2px,
      transparent 3px
    );
    mix-blend-mode:overlay;
  }
  .crt-overlay{
    position:fixed; inset:0; pointer-events:none; z-index:51;
    box-shadow: inset 0 0 18vw rgba(0,0,0,0.75);
    animation:flicker 6s infinite;
  }
  @keyframes flicker{
    0%,96%,100%{opacity:1;}
    97%{opacity:0.88;}
    98%{opacity:1;}
    99%{opacity:0.92;}
  }

  /* ---------- loading ---------- */
  .loading{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:var(--f-display); font-size:1.6rem; color:var(--green);
    letter-spacing:0.05em; z-index:100; background:var(--void);
  }
  .loading::after{content:"_"; animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}

  /* ---------- stage / grid ---------- */
  .stage{
    position:relative;
    max-width:1400px;
    margin:0 auto;
    padding:20px;
    min-height:100vh;
    display:grid;
    gap:16px;
    grid-template-columns: 1fr min(360px, 34vw) 1fr;
    grid-template-rows: auto auto auto auto auto;
    grid-template-areas:
      "hero hero hero"
      "tl   img  tr"
      "ml   img  mr"
      "bl   img  br"
      "foot foot foot";
    align-items:start;
  }

  .portrait{
    grid-area:img;
    position:relative;
    align-self:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  .portrait__frame{
    position:relative;
    width:100%;
    border-radius:10px;
    overflow:hidden;
    border:2px solid var(--panel-edge);
    box-shadow:0 0 0 1px rgba(255,255,255,0.03), 0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(169,91,255,0.25);
    background:
      linear-gradient(160deg, rgba(255,63,180,0.12), rgba(63,242,255,0.08)),
      var(--panel);
  }
  .portrait__frame img{
    display:block; width:100%; height:auto; position:relative; z-index:1;
  }
  .portrait__frame::after{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,0.05) 0 1px, transparent 1px 3px);
    pointer-events:none; z-index:2; mix-blend-mode:overlay;
  }
  .portrait__fallback{
    width:100%; aspect-ratio:3/4; display:flex; align-items:center; justify-content:center;
    font-size:5rem; background:var(--panel);
  }
  .portrait__caption{
    font-family:var(--f-pixel); font-size:0.55rem; color:var(--text-dim);
    letter-spacing:0.05em; text-align:center;
  }

  .badges{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
  }
  .badge{
    font-family:var(--f-pixel); font-size:0.5rem; padding:6px 8px;
    border-radius:999px; border:1px solid currentColor; background:rgba(0,0,0,0.35);
    white-space:nowrap;
  }

  /* ---------- cards, shared shell ---------- */
  .card{
    background:linear-gradient(160deg, rgba(255,255,255,0.03), transparent 40%), var(--panel);
    border:1px solid var(--panel-edge);
    border-radius:8px;
    box-shadow:0 10px 30px rgba(0,0,0,0.45);
    overflow:hidden;
    animation:rise 0.5s ease both;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }

  .card__bar{
    display:flex; align-items:center; gap:8px;
    padding:7px 10px;
    background:rgba(0,0,0,0.35);
    border-bottom:1px solid var(--panel-edge);
    font-family:var(--f-mono); font-size:0.7rem; color:var(--text-dim);
  }
  .dot{width:9px; height:9px; border-radius:50%; display:inline-block;}
  .dot--r{background:#ff5f57;} .dot--y{background:#febc2e;} .dot--g{background:#28c840;}

  .card__body{padding:14px 16px;}

  /* accent glow driven by data-accent */
  .card[data-accent="neonPink"]{box-shadow:0 10px 30px rgba(0,0,0,0.45), 0 0 24px rgba(255,63,180,0.18);}
  .card[data-accent="neonCyan"]{box-shadow:0 10px 30px rgba(0,0,0,0.45), 0 0 24px rgba(63,242,255,0.18);}
  .card[data-accent="neonPurple"]{box-shadow:0 10px 30px rgba(0,0,0,0.45), 0 0 24px rgba(169,91,255,0.18);}
  .card[data-accent="neonGreen"]{box-shadow:0 10px 30px rgba(0,0,0,0.45), 0 0 24px rgba(61,255,160,0.18);}
  .card[data-accent="neonYellow"]{box-shadow:0 10px 30px rgba(0,0,0,0.45), 0 0 24px rgba(255,224,102,0.18);}

  /* ---------- variant: hero / glitch banner ---------- */
  .card--hero{grid-area:hero; text-align:center; padding:22px 16px; background:transparent; border:none; box-shadow:none;}
  .glitch{
    font-family:var(--f-display);
    font-size:clamp(1.8rem, 5vw, 3.4rem);
    letter-spacing:0.02em;
    margin:0; position:relative; color:var(--text-main);
    text-shadow:0 0 18px rgba(255,63,180,0.35);
  }
  .glitch::before, .glitch::after{
    content:attr(data-text); position:absolute; left:0; top:0; width:100%;
    overflow:hidden; background:transparent;
  }
  .glitch::before{color:var(--cyan); left:2px; animation:glitch-1 3.2s infinite linear alternate-reverse;}
  .glitch::after{color:var(--pink); left:-2px; animation:glitch-2 2.4s infinite linear alternate-reverse;}
  @keyframes glitch-1{
    0%{clip-path:inset(0 0 85% 0);} 20%{clip-path:inset(10% 0 60% 0);}
    40%{clip-path:inset(40% 0 30% 0);} 60%{clip-path:inset(70% 0 5% 0);}
    80%{clip-path:inset(20% 0 50% 0);} 100%{clip-path:inset(0 0 90% 0);}
  }
  @keyframes glitch-2{
    0%{clip-path:inset(80% 0 0 0);} 25%{clip-path:inset(30% 0 40% 0);}
    50%{clip-path:inset(60% 0 10% 0);} 75%{clip-path:inset(5% 0 70% 0);}
    100%{clip-path:inset(45% 0 25% 0);}
  }
  .hero__sub{
    font-family:var(--f-mono); color:var(--text-dim); font-size:0.85rem;
    margin-top:8px; letter-spacing:0.03em;
  }

  /* ---------- variant: terminal ---------- */
  .term-line{margin:0 0 6px 0; font-size:0.82rem; line-height:1.5;}
  .term-line:last-child{margin-bottom:0;}
  .term-prompt{color:var(--cyan); margin-right:6px; font-weight:700;}

  /* ---------- variant: stat-block ---------- */
  .stat-row{display:flex; gap:8px; font-size:0.8rem; margin-bottom:5px;}
  .stat-row:last-child{margin-bottom:0;}
  .stat-key{color:var(--purple); min-width:64px; font-weight:700;}
  .stat-val{color:var(--text-main);}

  /* ---------- variant: quote ---------- */
  .card--quote .card__body{padding:18px 16px;}
  .quote__text{font-family:var(--f-display); font-size:1.3rem; line-height:1.4; margin:0; color:var(--green);}
  .quote__text::before{content:"“";} .quote__text::after{content:"”";}
  .quote__sig{font-size:0.7rem; color:var(--text-dim); margin-top:8px;}

  /* ---------- variant: error window ---------- */
  .error__msg{font-size:0.85rem; margin:0 0 6px 0;}
  .error__detail{font-size:0.72rem; color:var(--text-dim); margin:0 0 12px 0;}
  .error__buttons{display:flex; gap:8px; flex-wrap:wrap;}
  .error__btn{
    font-family:var(--f-mono); font-size:0.72rem; padding:6px 10px;
    background:rgba(255,255,255,0.06); border:1px solid var(--panel-edge); border-radius:4px;
    color:var(--text-main); cursor:default;
  }

  /* ---------- variant: list ---------- */
  .list{margin:0; padding-left:1.1em; font-size:0.8rem; line-height:1.7;}
  .list li::marker{color:var(--yellow);}

  /* ---------- variant: links / footer ---------- */
  .card--links{grid-area:foot; background:transparent; border:none; box-shadow:none;}
  .links__row{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; padding:6px 0 4px;}
  .links__item{
    font-family:var(--f-pixel); font-size:0.6rem; color:var(--text-main); text-decoration:none;
    padding:8px 12px; border:1px solid var(--panel-edge); border-radius:6px; background:var(--panel);
  }
  .links__item:hover{border-color:var(--pink); color:var(--pink);}
  .copyright{text-align:center; font-size:0.68rem; color:var(--text-dim); margin-top:10px;}

  /* ---------- grid area assignment ---------- */
  [data-area="tl"]{grid-area:tl;}
  [data-area="tr"]{grid-area:tr;}
  [data-area="ml"]{grid-area:ml;}
  [data-area="mr"]{grid-area:mr;}
  [data-area="bl"]{grid-area:bl;}
  [data-area="br"]{grid-area:br;}

  /* ---------- mobile: collapse to a single readable column ---------- */
  @media (max-width: 760px){
    .stage{
      display:flex;
      flex-direction:column;
      padding:14px;
      gap:14px;
    }
    .glitch{font-size:clamp(1.5rem, 8vw, 2.1rem);}
    .badge{font-size:0.46rem;}
  }

  @media (prefers-reduced-motion: reduce){
    .glitch::before,.glitch::after,.crt-overlay,.loading::after{animation:none !important;}
  }
</style>
</head>
<body>

  <div class="scanlines"></div>
  <div class="crt-overlay"></div>

  <main class="stage" id="stage">
    <div class="loading" id="loading">loading</div>
  </main>

  <script src="/bunny/night/js/script.js"></script>
</body>
</html>
